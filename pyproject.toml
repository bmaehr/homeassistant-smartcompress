[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-smartcompress"
version = "1.0.0"
description = "Intelligent, time-tiered database compression, attribute smoothing, and deduplication tool for Home Assistant (PostgreSQL & SQLite)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "HomeAssistant-SmartCompress Contributors" }
]
keywords = [
    "homeassistant",
    "home-assistant",
    "database",
    "compression",
    "deduplication",
    "postgres",
    "sqlite",
    "iot",
    "recorder",
    "optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Archiving",
    "Topic :: Home Automation"
]
dependencies = []

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.0"
]
yaml = [
    "PyYAML>=6.0.0"
]
all = [
    "psycopg2-binary>=2.9.0",
    "PyYAML>=6.0.0"
]

[project.scripts]
ha-smartcompress = "homeassistant_smartcompress:main"

[project.urls]
Homepage = "https://github.com/bmaehr/HomeAssistant-SmartCompress"
Repository = "https://github.com/bmaehr/HomeAssistant-SmartCompress"
"Bug Tracker" = "https://github.com/bmaehr/HomeAssistant-SmartCompress/issues"
